name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - supabase/functions/**
      - .github/workflows/deploy-supabase-functions.yml
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: kypvylnyugmiukobsjoi
      APP_ORIGIN: https://condominioguest.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN secret"
            exit 1
          fi

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          functions=(create-user delete-user update-role send-urgent-occurrence-email)
          for fn in "${functions[@]}"; do
            echo "Deploying $fn"
            npx supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          done

      - name: Validate function endpoints
        run: |
          set -euo pipefail
          functions=(create-user delete-user update-role send-urgent-occurrence-email)
          for fn in "${functions[@]}"; do
            url="https://${PROJECT_REF}.supabase.co/functions/v1/${fn}"
            status=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$url" \
              -H "Origin: ${APP_ORIGIN}" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization,content-type,apikey")
            if [ "$status" != "200" ]; then
              echo "Function ${fn} failed validation with status ${status}"
              exit 1
            fi
            echo "Function ${fn} is reachable (HTTP 200)."
          done